name: New stack CI

on:
  push:
    paths:
      - "backend/**"
      - "frontend/**"
      - "infra/**"
      - ".github/workflows/new-stack-ci.yml"
  pull_request:
    paths:
      - "backend/**"
      - "frontend/**"
      - "infra/**"
      - ".github/workflows/new-stack-ci.yml"

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.6-alpine3.23
        env:
          POSTGRES_DB: task_management
          POSTGRES_USER: task_management
          POSTGRES_PASSWORD: task_management_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U task_management -d task_management"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DJANGO_SETTINGS_MODULE: config.settings.test
      DJANGO_SECRET_KEY: ci-only-secret
      POSTGRES_DB: task_management
      POSTGRES_USER: task_management
      POSTGRES_PASSWORD: task_management_ci
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: python -m pip install -r backend/requirements-dev.txt
      - run: python backend/manage.py check
      - run: python -m pytest backend

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run lint
        working-directory: frontend
      - run: npm run test -- --run --coverage
        working-directory: frontend
      - run: npm run build
        working-directory: frontend

  e2e:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: docker compose -f infra/compose.e2e.yaml up --build -d --wait
      - run: curl --fail http://localhost:8000/ready/
      - run: npm run test:e2e
        working-directory: frontend
        env:
          CI: "true"
          E2E_BASE_URL: http://localhost:5173
          E2E_API_BASE_URL: http://localhost:8000
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 14
      - run: docker compose -f infra/compose.e2e.yaml down -v
        if: always()

  production-smoke:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    env:
      DJANGO_SECRET_KEY: ci-production-only-secret-abcdefghijklmnopqrstuvwxyz-1234567890
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
      POSTGRES_DB: task_management_prod_ci
      POSTGRES_USER: task_management
      POSTGRES_PASSWORD: production-ci-database-password
      CSRF_TRUSTED_ORIGINS: https://localhost:8443
      TLS_CERT_DIR: /tmp/task-management-tls
      BACKUP_DIR: /tmp/task-management-backups
      HTTPS_PORT: "8443"
    steps:
      - uses: actions/checkout@v4
      - name: Create ephemeral rehearsal certificate
        run: |
          mkdir -p "$TLS_CERT_DIR" "$BACKUP_DIR"
          openssl req -x509 -newkey rsa:2048 -nodes \
            -keyout "$TLS_CERT_DIR/privkey.pem" \
            -out "$TLS_CERT_DIR/fullchain.pem" \
            -days 1 -subj "/CN=localhost" \
            -addext "subjectAltName=DNS:localhost,IP:127.0.0.1"
      - run: docker compose -f infra/compose.prod.yaml config --quiet
      - run: docker compose -f infra/compose.prod.yaml up --build -d --wait --scale backend=2
      - run: curl --fail --insecure https://localhost:8443/ready/
      - run: docker compose -f infra/compose.prod.yaml ps
      - run: docker compose -f infra/compose.prod.yaml down -v
        if: always()
