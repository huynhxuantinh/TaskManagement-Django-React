          description: ''
components:
  schemas:
    AccessData:
      type: object
      properties:
        access:
          type: string
          readOnly: true
      required:
      - access
    AccessResponse:
      type: object
      properties:
        success:
          type: boolean
          readOnly: true
        message:
          type: string
          readOnly: true
        data:
          allOf:
          - $ref: '#/components/schemas/AccessData'
          readOnly: true
      required:
      - data
      - message
      - success
    AddMember:
      type: object
      properties:
        user_id:
          type: integer
          minimum: 1
        email:
          type: string
          format: email
          maxLength: 100
    AvatarUpload:
      type: object
      properties:
        file:
          type: string
          format: uri
          writeOnly: true
      required:
      - file
    ChangePassword:
      type: object
      properties:
        current_password:
          type: string
          writeOnly: true
        new_password:
          type: string
          writeOnly: true
      required:
      - current_password
      - new_password
    Contributor:
      type: object
      properties:
        user:
          allOf:
          - $ref: '#/components/schemas/ContributorUser'
          readOnly: true
        completed_tasks:
          type: integer
          readOnly: true
        total_tasks:
          type: integer
          readOnly: true
      required:
      - completed_tasks
      - total_tasks
      - user
    ContributorListResponse:
      type: object
      properties:
        success:
          type: boolean
          readOnly: true
        message:
          type: string
          readOnly: true
        data:
          type: array
          items:
            $ref: '#/components/schemas/Contributor'
          readOnly: true
      required:
      - data
      - message
      - success
    ContributorUser:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        full_name:
          type: string
          readOnly: true
        email:
          type: string
          format: email
          readOnly: true
      required:
      - email
      - full_name
      - id
    Dashboard:
      type: object
      properties:
        project_count:
          type: integer
          readOnly: true
        task_count:
          type: integer
          readOnly: true
        completed_task_count:
          type: integer
          readOnly: true
        overdue_task_count:
          type: integer
          readOnly: true
        team_count:
          type: integer
          readOnly: true
        task_distribution:
          type: array
          items:
            $ref: '#/components/schemas/Distribution'
          readOnly: true
        recent_tasks:
          type: array
          items:
            $ref: '#/components/schemas/Task'
          readOnly: true
      required:
      - completed_task_count
      - overdue_task_count
      - project_count
      - recent_tasks
      - task_count
      - task_distribution
      - team_count
    DashboardResponse:
      type: object
      properties:
        success:
          type: boolean
          readOnly: true
        message:
          type: string
          readOnly: true
        data:
          allOf:
          - $ref: '#/components/schemas/Dashboard'
          readOnly: true
      required:
      - data
      - message
      - success
    Deactivate:
      type: object
      properties:
        password:
          type: string
          writeOnly: true
      required:
      - password
    Distribution:
      type: object
      properties:
        code:
          type: string
          readOnly: true
