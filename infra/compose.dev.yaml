name: task-management-dev

services:
  db:
    image: postgres:18.6-alpine3.23
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-task_management}
      POSTGRES_USER: ${POSTGRES_USER:-task_management}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-task_management_dev}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-55432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  migration:
    build:
      context: ../backend
    command: ["python", "manage.py", "migrate", "--noinput"]
    environment: &backend-environment
      DJANGO_SETTINGS_MODULE: config.settings.development
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-unsafe-development-key-change-me}
      POSTGRES_DB: ${POSTGRES_DB:-task_management}
      POSTGRES_USER: ${POSTGRES_USER:-task_management}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-task_management_dev}
      DB_HOST: db
      DB_PORT: 5432
      CORS_ALLOWED_ORIGINS: http://localhost:${FRONTEND_PORT:-5174}
      CSRF_TRUSTED_ORIGINS: http://localhost:${FRONTEND_PORT:-5174}
    volumes:
      - ../backend:/app
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  backend:
    build:
      context: ../backend
    environment: *backend-environment
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8010}:8000"
    volumes:
      - ../backend:/app
    depends_on:
      db:
        condition: service_healthy
      migration:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/').read()",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  frontend:
    build:
      context: ../frontend
    environment:
      VITE_API_BASE_URL: http://localhost:${BACKEND_PORT:-8010}
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-5174}:5173"
    volumes:
      - ../frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
  frontend_node_modules:
