openapi: 3.0.3
info:
  title: Task Management API
  version: 1.0.0
paths:
  /api/v1/auth/change-password/:
    post:
      operationId: v1_auth_change_password_create
      tags:
      - Auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePassword'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ChangePassword'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ChangePassword'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmptyResponse'
          description: ''
  /api/v1/auth/deactivate/:
    post:
      operationId: v1_auth_deactivate_create
      tags:
      - Auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Deactivate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Deactivate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Deactivate'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmptyResponse'
          description: ''
  /api/v1/auth/login/:
    post:
      operationId: v1_auth_login_create
      tags:
      - Auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Login'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Login'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Login'
        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
          description: ''
  /api/v1/auth/logout/:
    post:
      operationId: v1_auth_logout_create
      description: Blacklist refresh cookie; requires X-CSRFToken.
      tags:
      - Auth
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmptyResponse'
          description: ''
  /api/v1/auth/me/:
    get:
      operationId: v1_auth_me_retrieve
      tags:
      - Auth
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
          description: ''
  /api/v1/auth/refresh/:
    post:
      operationId: v1_auth_refresh_create
      description: Rotate refresh cookie; requires X-CSRFToken.
      tags:
      - Auth
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessResponse'
          description: ''
  /api/v1/auth/register/:
    post:
      operationId: v1_auth_register_create
      tags:
      - Auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Register'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Register'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Register'
        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
          description: ''
  /api/v1/projects/:
    get:
      operationId: v1_projects_list
      parameters:
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      tags:
      - Projects
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedProjectListResponseList'
          description: ''
    post:
      operationId: v1_projects_create
      tags:
      - Projects
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectWrite'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ProjectWrite'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ProjectWrite'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectResponse'
          description: ''
  /api/v1/projects/{id}/:
    get:
      operationId: v1_projects_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - Projects
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectResponse'
          description: ''
    patch:
      operationId: v1_projects_partial_update
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - Projects
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedProjectWrite'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedProjectWrite'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedProjectWrite'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectResponse'
          description: ''
    delete:
      operationId: v1_projects_destroy
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - Projects
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/projects/{id}/members/:
    get:
      operationId: v1_projects_members_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - Project members
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemberListResponse'
          description: ''
    post:
      operationId: v1_projects_members_create
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - Project members
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddMember'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AddMember'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AddMember'
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemberResponse'
          description: ''
  /api/v1/projects/{id}/members/{user_id}/:
    delete:
      operationId: v1_projects_members_destroy
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      - in: path
        name: user_id
        schema:
          type: integer
        required: true
      tags:
      - Project members
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
components:
  schemas:
    AccessData:
      type: object
      properties:
        access:
          type: string
          readOnly: true
      required:
      - access
    AccessResponse:
      type: object
      properties:
        success:
          type: boolean
          readOnly: true
        message:
          type: string
          readOnly: true
        data:
          allOf:
          - $ref: '#/components/schemas/AccessData'
          readOnly: true
      required:
      - data
      - message
      - success
    AddMember:
      type: object
      properties:
        user_id:
          type: integer
          minimum: 1
        email:
          type: string
          format: email
          maxLength: 100
    ChangePassword:
      type: object
      properties:
        current_password:
          type: string
          writeOnly: true
        new_password:
          type: string
          writeOnly: true
      required:
      - current_password
      - new_password
    Deactivate:
      type: object
      properties:
        password:
          type: string
          writeOnly: true
      required:
      - password
    EmptyResponse:
      type: object
      properties:
        success:
          type: boolean
          readOnly: true
        message:
          type: string
          readOnly: true
        data:
          readOnly: true
          nullable: true
      required:
      - data
      - message
      - success
    Login:
      type: object
      properties:
        email:
          type: string
          format: email
          maxLength: 100
        password:
          type: string
          writeOnly: true
      required:
      - email
      - password
    LoginData:
      type: object
      properties:
        access:
          type: string
          readOnly: true
        user:
          allOf:
          - $ref: '#/components/schemas/User'
          readOnly: true
      required:
      - access
      - user
    LoginResponse:
      type: object
      properties:
        success:
          type: boolean
          readOnly: true
        message:
          type: string
          readOnly: true
        data:
          allOf:
          - $ref: '#/components/schemas/LoginData'
          readOnly: true
      required:
      - data
      - message
      - success
    MemberListData:
      type: object
      properties:
        count:
          type: integer
          readOnly: true
        next:
          type: string
          format: uri
          readOnly: true
          nullable: true
        previous:
          type: string
          format: uri
          readOnly: true
          nullable: true
        results:
          type: array
          items:
            $ref: '#/components/schemas/ProjectMember'
          readOnly: true
      required:
      - count
      - next
      - previous
      - results
    MemberListResponse:
      type: object
      properties:
        success:
          type: boolean
          readOnly: true
        message:
          type: string
          readOnly: true
        data:
          allOf:
          - $ref: '#/components/schemas/MemberListData'
          readOnly: true
      required:
      - data
      - message
      - success
    MemberResponse:
      type: object
      properties:
        success:
          type: boolean
          readOnly: true
        message:
          type: string
          readOnly: true
        data:
          allOf:
          - $ref: '#/components/schemas/ProjectMember'
          readOnly: true
      required:
      - data
      - message
      - success
    PaginatedProjectListResponseList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=4
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=2
        results:
          type: array
          items:
            $ref: '#/components/schemas/ProjectListResponse'
    PatchedProjectWrite:
      type: object
      properties:
        name:
          type: string
          maxLength: 200
        description:
          type: string
          maxLength: 500
        start_date:
          type: string
          format: date
          nullable: true
        end_date:
          type: string
          format: date
          nullable: true
    Project:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 200
        description:
          type: string
          maxLength: 500
        start_date:
          type: string
          format: date
          nullable: true
        end_date:
          type: string
          format: date
          nullable: true
        creator:
          allOf:
          - $ref: '#/components/schemas/ProjectUser'
          readOnly: true
        member_count:
          type: integer
          readOnly: true
        progress:
          type: integer
          readOnly: true
        created_at:
          type: string
          format: date-time
      required:
      - creator
      - id
      - member_count
      - name
      - progress
    ProjectListData:
      type: object
      properties:
        count:
          type: integer
          readOnly: true
        next:
          type: string
          format: uri
          readOnly: true
          nullable: true
        previous:
          type: string
          format: uri
          readOnly: true
          nullable: true
        results:
          type: array
          items:
            $ref: '#/components/schemas/Project'
          readOnly: true
      required:
      - count
      - next
      - previous
      - results
    ProjectListResponse:
      type: object
      properties:
        success:
          type: boolean
          readOnly: true
        message:
          type: string
          readOnly: true
        data:
          allOf:
          - $ref: '#/components/schemas/ProjectListData'
          readOnly: true
      required:
      - data
      - message
      - success
    ProjectMember:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        user:
          allOf:
          - $ref: '#/components/schemas/ProjectUser'
          readOnly: true
        joined_at:
          type: string
          format: date-time
      required:
      - id
      - user
    ProjectResponse:
      type: object
      properties:
        success:
          type: boolean
          readOnly: true
        message:
          type: string
          readOnly: true
        data:
          allOf:
          - $ref: '#/components/schemas/Project'
          readOnly: true
      required:
      - data
      - message
      - success
    ProjectUser:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        full_name:
          type: string
          maxLength: 100
        email:
          type: string
          format: email
          maxLength: 100
        role:
          type: string
          readOnly: true
        avatar_url:
          type: string
          readOnly: true
      required:
      - avatar_url
      - email
      - full_name
      - id
      - role
    ProjectWrite:
      type: object
      properties:
        name:
          type: string
          maxLength: 200
        description:
          type: string
          maxLength: 500
        start_date:
          type: string
          format: date
          nullable: true
        end_date:
          type: string
          format: date
          nullable: true
      required:
      - name
    Register:
      type: object
      properties:
        email:
          type: string
          format: email
          maxLength: 100
        full_name:
          type: string
          maxLength: 100
        password:
          type: string
          writeOnly: true
      required:
      - email
      - full_name
      - password
    User:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        full_name:
          type: string
          maxLength: 100
        email:
          type: string
          format: email
          maxLength: 100
        role:
          type: string
          readOnly: true
        avatar_url:
          type: string
          readOnly: true
        is_active:
          type: boolean
        created_at:
          type: string
          format: date-time
        permissions:
          type: array
          items:
            type: string
          readOnly: true
      required:
      - avatar_url
      - email
      - full_name
      - id
      - permissions
      - role
    UserResponse:
      type: object
      properties:
        success:
          type: boolean
          readOnly: true
        message:
          type: string
          readOnly: true
        data:
          allOf:
          - $ref: '#/components/schemas/User'
          readOnly: true
      required:
      - data
      - message
      - success
  securitySchemes:
    jwtAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
