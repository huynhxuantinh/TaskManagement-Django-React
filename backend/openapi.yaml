openapi: 3.0.3
info:
  title: Task Management API
  version: 1.0.0
paths:
  /api/v1/auth/change-password/:
    post:
      operationId: v1_auth_change_password_create
      tags:
      - Auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePassword'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ChangePassword'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ChangePassword'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmptyResponse'
          description: ''
  /api/v1/auth/deactivate/:
    post:
      operationId: v1_auth_deactivate_create
      tags:
      - Auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Deactivate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Deactivate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Deactivate'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmptyResponse'
          description: ''
  /api/v1/auth/login/:
    post:
      operationId: v1_auth_login_create
      tags:
      - Auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Login'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Login'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Login'
        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
          description: ''
  /api/v1/auth/logout/:
    post:
      operationId: v1_auth_logout_create
      description: Blacklist refresh cookie; requires X-CSRFToken.
      tags:
      - Auth
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmptyResponse'
          description: ''
  /api/v1/auth/me/:
    get:
      operationId: v1_auth_me_retrieve
      tags:
      - Auth
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
          description: ''
  /api/v1/auth/refresh/:
    post:
      operationId: v1_auth_refresh_create
      description: Rotate refresh cookie; requires X-CSRFToken.
      tags:
      - Auth
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessResponse'
          description: ''
  /api/v1/auth/register/:
    post:
      operationId: v1_auth_register_create
      tags:
      - Auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Register'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Register'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Register'
        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
          description: ''
components:
  schemas:
    AccessData:
      type: object
      properties:
        access:
          type: string
          readOnly: true
      required:
      - access
    AccessResponse:
      type: object
      properties:
        success:
          type: boolean
          readOnly: true
        message:
          type: string
          readOnly: true
        data:
          allOf:
          - $ref: '#/components/schemas/AccessData'
          readOnly: true
      required:
      - data
      - message
      - success
    ChangePassword:
      type: object
      properties:
        current_password:
          type: string
          writeOnly: true
        new_password:
          type: string
          writeOnly: true
      required:
      - current_password
      - new_password
    Deactivate:
      type: object
      properties:
        password:
          type: string
          writeOnly: true
      required:
      - password
    EmptyResponse:
      type: object
      properties:
        success:
          type: boolean
          readOnly: true
        message:
          type: string
          readOnly: true
        data:
          readOnly: true
          nullable: true
      required:
      - data
      - message
      - success
    Login:
      type: object
      properties:
        email:
          type: string
          format: email
          maxLength: 100
        password:
          type: string
          writeOnly: true
      required:
      - email
      - password
    LoginData:
      type: object
      properties:
        access:
          type: string
          readOnly: true
        user:
          allOf:
          - $ref: '#/components/schemas/User'
          readOnly: true
      required:
      - access
      - user
    LoginResponse:
      type: object
      properties:
        success:
          type: boolean
          readOnly: true
        message:
          type: string
          readOnly: true
        data:
          allOf:
          - $ref: '#/components/schemas/LoginData'
          readOnly: true
      required:
      - data
      - message
      - success
    Register:
      type: object
      properties:
        email:
          type: string
          format: email
          maxLength: 100
        full_name:
          type: string
          maxLength: 100
        password:
          type: string
          writeOnly: true
      required:
      - email
      - full_name
      - password
    User:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        full_name:
          type: string
          maxLength: 100
        email:
          type: string
          format: email
          maxLength: 100
        role:
          type: string
          readOnly: true
        avatar_url:
          type: string
          readOnly: true
        is_active:
          type: boolean
        created_at:
          type: string
          format: date-time
        permissions:
          type: array
          items:
            type: string
          readOnly: true
      required:
      - avatar_url
      - email
      - full_name
      - id
      - permissions
      - role
    UserResponse:
      type: object
      properties:
        success:
          type: boolean
          readOnly: true
        message:
          type: string
          readOnly: true
        data:
          allOf:
          - $ref: '#/components/schemas/User'
          readOnly: true
      required:
      - data
      - message
      - success
  securitySchemes:
    jwtAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
